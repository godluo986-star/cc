# One-command deployment:  docker compose up -d --build
# Data (accounts, rooms, world state) persists in the named volume.
services:
  nexuspark:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # Set a fixed secret so sessions survive container rebuilds:
      # JWT_SECRET: "change-me-to-a-long-random-string"
    volumes:
      - nexuspark-data:/app/server/data
    restart: unless-stopped

volumes:
  nexuspark-data:
